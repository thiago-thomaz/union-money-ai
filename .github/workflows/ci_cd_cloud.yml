name: UNION MONEY AI — Cloud CI/CD & Health Gate

on:
  push:
    branches:
      - main

jobs:
  verify-and-audit-cloud-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsqlite3-dev libpng-dev libjpeg-dev curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Cloud Preflight & Automated Test Suite
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.cloud_entrypoint --verify-only
          pytest -v

      - name: Verify Production Cloud Health & HTTPS Domain
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://afiliados.projetosunion.cloud/health
